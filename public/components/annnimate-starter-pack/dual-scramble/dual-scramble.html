<!-- Dual Scramble — Two-phase text scramble: scrambles through phase-1 color, resolves to phase-2 -->

<div class="dual_scramble_wrap">

  <!-- Hero group: scroll-triggered, staggered -->
  <div class="dual_scramble_hero"
    data-anm-dual-scramble-group
    data-anm-trigger="scroll"
    data-anm-stagger="0.15"
    data-anm-start="top 80%"
  >
    <span class="dual_scramble_eyebrow">Kinetic Athletics</span>
    <h1
      class="dual_scramble_headline"
      data-anm-dual-scramble
      data-anm-duration="0.8"
    >
      Built for speed.
    </h1>
    <p
      class="dual_scramble_sub"
      data-anm-dual-scramble
      data-anm-duration="0.6"
    >
      Carbon-plate running shoes engineered for race day.
    </p>
  </div>

  <!-- Nav items: hover-triggered -->
  <nav class="dual_scramble_nav">
    <span class="dual_scramble_nav_label">Hover</span>
    <div class="dual_scramble_nav_links">
      <span
        class="dual_scramble_nav_link"
        data-anm-dual-scramble
        data-anm-trigger="hover"
        data-anm-duration="0.5"
      >Running</span>
      <span
        class="dual_scramble_nav_link"
        data-anm-dual-scramble
        data-anm-trigger="hover"
        data-anm-duration="0.5"
      >Cycling</span>
      <span
        class="dual_scramble_nav_link"
        data-anm-dual-scramble
        data-anm-trigger="hover"
        data-anm-duration="0.5"
      >Training</span>
      <span
        class="dual_scramble_nav_link"
        data-anm-dual-scramble
        data-anm-trigger="hover"
        data-anm-duration="0.5"
      >Apparel</span>
    </div>
  </nav>

  <!-- Stat items: click-triggered -->
  <div class="dual_scramble_stats">
    <span class="dual_scramble_stats_label">Click</span>
    <div class="dual_scramble_stats_grid">
      <div class="dual_scramble_stat">
        <span
          class="dual_scramble_stat_value"
          data-anm-dual-scramble
          data-anm-trigger="click"
          data-anm-duration="0.5"
        >42.2KM</span>
        <span class="dual_scramble_stat_key">Distance</span>
      </div>
      <div class="dual_scramble_stat">
        <span
          class="dual_scramble_stat_value"
          data-anm-dual-scramble
          data-anm-trigger="click"
          data-anm-duration="0.5"
        >04:12</span>
        <span class="dual_scramble_stat_key">Pace / km</span>
      </div>
      <div class="dual_scramble_stat">
        <span
          class="dual_scramble_stat_value"
          data-anm-dual-scramble
          data-anm-trigger="click"
          data-anm-duration="0.5"
        >158BPM</span>
        <span class="dual_scramble_stat_key">Heart rate</span>
      </div>
    </div>
  </div>

</div>
